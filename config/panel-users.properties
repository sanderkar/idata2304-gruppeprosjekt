# Server-owned account configuration
# Accounts without their token environment variable are disabled.
users=sha-example,owner-example,guest-example,technician-example

sha-example.role=SHA
sha-example.token-env=SMART_HOME_SHA_TOKEN

owner-example.role=OWNER
owner-example.token-env=SMART_HOME_PANEL_TOKEN

guest-example.role=GUEST
guest-example.token-env=SMART_HOME_GUEST_TOKEN
guest-example.sensors=12:1
guest-example.actuators=12:1

technician-example.role=TECHNICIAN
technician-example.token-env=SMART_HOME_TECHNICIAN_TOKEN
